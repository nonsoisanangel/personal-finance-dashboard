<form class="transaction-form" method="POST" action="{{ url_for('add_transaction') }}">
    <label>
        Description
        <input type="text" name="description" maxlength="80" placeholder="e.g. Grocery shopping" required>
    </label>

    <div class="form-row">
        <label>
            Amount
            <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
        <label>
            Type
            <select name="type" required>
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>
        </label>
    </div>

    <div class="form-row">
        <label>
            Category
            <select name="category" required>
                {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Date
            <input type="date" name="transaction_date" value="{{ today }}" required>
        </label>
    </div>

    <button class="button button-primary full-width" type="submit">Save transaction</button>
</form>
